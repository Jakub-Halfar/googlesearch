<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Google Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="search-page">
        <nav class="top-nav" aria-label="Search navigation">
            <a href="image.html">Image Search</a>
            <a href="advanced.html">Advanced Search</a>
        </nav>

        <div class="google-logo" role="img" aria-label="Google">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>

        <form class="search-form" action="https://www.google.com/search" method="get">
            <label for="search-query" class="visually-hidden">Search</label>
            <input id="search-query" class="search-input" type="text" name="q" autocomplete="off">
            <div class="button-row">
                <button class="search-button" type="submit">Google Search</button>
                <button class="search-button" type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
            </div>
        </form>

        <footer class="site-footer">
            <a href="forms.html">Formuláře</a>
            <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fjakub-halfar.github.io%2Fgooglesearch%2Findex.html">Validace HTML</a>
            <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fjakub-halfar.github.io%2Fgooglesearch%2Fstyles.css">Validace CSS</a>
            <a href="https://github.com/Jakub-Halfar/googlesearch/blob/main/citace.md">Citace a zdroje</a>
            <a href="https://jakub-halfar.github.io">Portfolio</a>
        </footer>
    </body>
</html>
