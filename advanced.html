<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Google Advanced Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="advanced-page">
        <nav class="top-nav" aria-label="Search navigation">
            <a href="index.html">Google Search</a>
        </nav>

        <main class="advanced-content">
            <h1 class="advanced-title">Advanced Search</h1>
            <form class="advanced-form" action="https://www.google.com/search" method="get">
                <h2>Find pages with...</h2>
                <div class="advanced-field">
                    <label for="all-words">all these words:</label>
                    <input id="all-words" type="text" name="as_q">
                </div>
                <div class="advanced-field">
                    <label for="exact-phrase">this exact word or phrase:</label>
                    <input id="exact-phrase" type="text" name="as_epq">
                </div>
                <div class="advanced-field">
                    <label for="any-words">any of these words:</label>
                    <input id="any-words" type="text" name="as_oq">
                </div>
                <div class="advanced-field">
                    <label for="none-words">none of these words:</label>
                    <input id="none-words" type="text" name="as_eq">
                </div>
                <button class="advanced-button" type="submit">Advanced Search</button>
            </form>
        </main>

        <footer class="site-footer">
            <a href="forms.html">Formuláře</a>
            <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fjakub-halfar.github.io%2Fgooglesearch%2Fadvanced.html">Validace HTML</a>
            <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fjakub-halfar.github.io%2Fgooglesearch%2Fstyles.css">Validace CSS</a>
            <a href="https://github.com/Jakub-Halfar/googlesearch/blob/main/citace.md">Citace a zdroje</a>
            <a href="https://github.com/Jakub-Halfar">Portfolio</a>
        </footer>
    </body>
</html>
